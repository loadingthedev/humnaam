name: Publish to npm

# Runs when a version tag is pushed: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Tag must match package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      # No token: npm trusts this workflow through OIDC (set up once with `npm trust github`).
      # prepublishOnly runs the tests and the build.
      - run: npm publish --access public
